    const fetchWithRetry = async (url, options, retries = 5, backoff = 1000) => {
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || `HTTP 連線錯誤 (${response.status})`);
          }
          return await response.json();
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(res => setTimeout(res, backoff));
          backoff *= 2;
        }
      }
    };

    function App() {

      const [tips, setTips] = useState([]);
      const [newTip, setNewTip] = useState('');

      const [toastMsg, setToastMsg] = useState('');

      const [draftModal, setDraftModal] = useState({ isOpen: false, title: '', content: '', loading: false });

      const today = new Date().toISOString().split('T')[0];

      // ==========================================
      // ✨ 核心修復：AI 自動降級備援機制
      // 解決因金鑰權限不同導致的 404 / Not Found 報錯
      // ==========================================
      const callGeminiAPI = async (partsArray, isJson = false) => {
        if (!apiKey) throw new Error("請先在程式碼中填寫您的 Gemini API 金鑰！");

        const isLocalPreview = typeof __firebase_config !== 'undefined';
        
        // 自動降級清單：優先用最新 1.5 系列，若權限不足自動退回 1.0 (gemini-pro)
        const modelsToTry = isLocalPreview
          ? ["gemini-2.5-flash-preview-09-2025"]
          : ["gemini-1.5-flash", "gemini-1.5-pro", "gemini-pro"];

        const payload = { contents: [{ parts: partsArray }] };

        if (isJson) {
          payload.generationConfig = {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                title: { type: "STRING" },
                category: { type: "STRING" },
                reminderTarget: { type: "STRING" },
                details: { type: "STRING" }
              }
            }
          };
        }

        let lastError = null;
        for (const model of modelsToTry) {
          try {
            // gemini-pro (舊版) 不支援圖片輸入，若降級到此模型需剃除圖片以防報錯
            let finalPayload = payload;
            if (model === "gemini-pro") {
               const textOnlyParts = partsArray.filter(p => p.text);
               finalPayload = { contents: [{ parts: textOnlyParts }] };
            }

            const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalPayload)
            });

            const text = response.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) return text;
            else throw new Error("AI 未回傳任何文字結果。");

          } catch (error) {
            lastError = error;
            console.warn(`[自動降級系統] 模型 ${model} 呼叫失敗:`, error.message);
            // 只要是 "not found" (404) 或不支援，就跳過嘗試下一個更舊的模型
            if (error.message.includes("not found") || error.message.includes("not supported") || error.message.includes("404")) {
              continue;
            } else {
              throw error; // 若是金鑰無效或額度耗盡，直接拋出錯誤
            }
          }
        }
        throw lastError || new Error("您的金鑰沒有權限使用任何 AI 模型。");
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      const handleCopy = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {

        if (!refImages) return [];
        if (Array.isArray(refImages)) return refImages;
        if (typeof refImages === 'string') {
          if (refImages.startsWith('data:image')) return [refImages];

      const getItemStatus = (dueDate) => {
        if (!dueDate) return { status: 'none', color: 'bg-gray-100 text-gray-600 border border-gray-200', text: '無特定期限' };
        
        const due = new Date(dueDate);

      };

      // 圖片壓縮優化：增強處理機制，防止失敗時程式崩潰
      const compressImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const rawBase64 = event.target.result;
            const img = new Image();
            img.src = rawBase64;
            
            img.onload = () => {
              try {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800; 
                const MAX_HEIGHT = 800;
                let width = img.width;
                let height = img.height;

                if (width === 0 || height === 0) return resolve(rawBase64);

                if (width > height) {
                  if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                  if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                if (dataUrl && dataUrl.length > 50 && dataUrl !== 'data:,') {
                  resolve(dataUrl);
                  return;
                }
              } catch (err) {
                console.warn("Canvas 壓縮遭阻擋，改用原始圖片", err);
              }
              resolve(rawBase64); // Fallback
            };
            img.onerror = () => resolve(rawBase64); 
          };
          reader.onerror = () => resolve(null); 
        });
      };

      const handleAnalyzeNotes = async () => {

        try {
          let promptText = `你是一位專業的國小總務處事務組長助手。請幫我將以下的「粗略筆記」或「照片」自動整理成一份格式清晰的業務筆記。\n\n`;
          promptText += `請提供 JSON 格式的回應，包含以下欄位：\n` +

                        `2. category: 最適合的業務分類 (只能從以下選項選一個：'採購發包', '修繕維護', '財產管理', '人事與場地', '庶務與活動', '水電與帳務', '其他')\n` +
                        `3. reminderTarget: 根據內容猜測應該聯絡或提醒誰（例如：出納、主計、請修人、廠商），若無則留空\n` +
                        `4. details: 詳細流程步驟與注意事項（請用繁體中文，將草稿轉換成條列式、有條理的說明，若有提到金額或系統代碼請務必保留）\n\n`;
          
          if (rawNote.trim()) {
            promptText += `以下是我的粗略筆記：\n${rawNote}\n`;
          } else {
            promptText += `(未提供文字草稿，請直接分析隨附的圖片內容來產出流程)\n`;
          }

          const parts = [{ text: promptText }];

          const base64Images = currentImages.filter(img => img.startsWith('data:image'));
          base64Images.forEach(base64Str => {
             const base64Data = base64Str.split(',')[1];
             const mimeType = base64Str.substring(5, base64Str.indexOf(';'));
             parts.push({ inlineData: { mimeType: mimeType, data: base64Data } });
          });

          const responseText = await callGeminiAPI(parts, true);

          let cleanText = responseText.trim();
          const regex = new RegExp('`{3}(?:json)?([\\s\\S]*?)`{3}');
          const match = cleanText.match(regex);
          if (match) {
            cleanText = match[1].trim();
          }
          
          try {
            const result = JSON.parse(cleanText);
            setFormData(prev => ({
              ...prev,
              title: result.title || prev.title,
              category: categories.includes(result.category) ? result.category : (prev.category || categories[0]),
              reminderTarget: result.reminderTarget || prev.reminderTarget,
              details: result.details || prev.details
            }));
            showToast('✨ AI 整理成功！已為您自動填入下方的正式表單中。');
          } catch (parseError) {
            console.error("JSON Parse Error:", parseError, "Raw Text:", responseText);
            throw new Error("AI 回傳的資料格式有誤，無法自動套用。");
          }
        } catch (error) {
          showToast(`❌ 整理失敗：${error.message}`);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const downloadBackup = (currentItems, currentTips, currentTrashed) => {
        const dateStr = new Date().toLocaleString('zh-TW');
        const safeDate = new Date().toISOString().split('T')[0];
        
        let content = `國小事務組長業務系統 - 資料備份 (${dateStr})\n`;
        content += `=================================================\n\n`;

        content += `【💡 跑馬燈小撇步 / 備忘錄】 (共 ${currentTips.length} 條)\n`;
        content += `-------------------------------------------------\n`;
        currentTips.forEach((t, i) => {
          content += `${i + 1}. ${t.text}\n`;
        });
        content += `\n\n`;

        content += `【📁 作用中業務細節庫】 (共 ${currentItems.length} 筆)\n`;
        content += `-------------------------------------------------\n`;
        
        const sortedItems = [...currentItems].sort((a, b) => {
          if (a.category < b.category) return -1;
          if (a.category > b.category) return 1;
          return 0;
        });

        sortedItems.forEach((item, i) => {
          content += `[${i + 1}] 任務名稱：${item.title}\n`;
          content += `    分類：${item.category}\n`;
          if (item.dueDate) content += `    到期日：${item.dueDate}\n`;
          if (item.reminderTarget) content += `    提醒對象：${item.reminderTarget}\n`;
          
          const images = getImagesArray(item.referenceImages);
          if (images.length > 0) {
            content += `    圖檔參照：共包含 ${images.length} 張圖片資料\n`;
          }
          
          content += `    詳細內容：\n`;
          const indentedDetails = item.details.split('\n').map(line => `      ${line}`).join('\n');
          content += `${indentedDetails}\n\n`;
          content += `- - - - - - - - - - - - - - - - - - - - - - - - -\n\n`;
        });

        if (currentTrashed && currentTrashed.length > 0) {
          content += `【🗑️ 已移至垃圾桶的資料】 (共 ${currentTrashed.length} 筆)\n`;
          content += `-------------------------------------------------\n`;
          currentTrashed.forEach((item, i) => {
            content += `[已刪除] ${item.title} (於 ${new Date(item.deletedAt).toLocaleString('zh-TW')} 刪除)\n`;
          });
        }

        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `事務組長業務備份_${safeDate}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        showToast('✅ 備份文字檔已成功下載');
      };

                <h3 className="font-bold text-slate-700 mb-3 flex items-center gap-2"><Tag size={18} className="text-blue-500" />作用中的分類</h3>
                <form onSubmit={handleAddCategory} className="flex gap-2 mb-4">
                  <input type="text" value={newCategory} onChange={(e) => setNewCategory(e.target.value)} placeholder="新增分類名稱..." className="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"/>
                  <button type="submit" disabled={!newCategory.trim()} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-blue-300 flex items-center gap-2 text-sm font-medium"><Plus size={16} /> 新增</button>
                </form>
                <div className="space-y-2">
                  {categories.map(cat => (
                    <div key={cat} className="flex items-center justify-between p-3 bg-blue-50/50 border border-blue-100 rounded-lg group shadow-sm">
                      <span className="font-medium text-slate-700">{cat}</span>
                      <button onClick={() => handleArchiveCategory(cat)} disabled={categories.length <= 1} className="p-1.5 text-slate-400 hover:text-amber-600 disabled:opacity-30"><Archive size={16} /></button>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <h3 className="font-bold text-slate-700 mb-3 flex items-center gap-2"><Archive size={18} className="text-slate-500" />已封存的分類</h3>
                <div className="space-y-2">
                  {archivedCategories.map(cat => (
                    <div key={cat} className="flex items-center justify-between p-3 bg-slate-100/50 border border-slate-100 rounded-lg group">
                      <span className="font-medium text-slate-500 line-through">{cat}</span>
                      <div className="flex gap-1 opacity-0 group-hover:opacity-100">
                        <button onClick={() => handleRestoreCategory(cat)} className="p-1.5 text-slate-400 hover:text-emerald-600"><RotateCcw size={16} /></button>
                        <button onClick={() => handleDeletePermanentlyCat(cat)} className="p-1.5 text-slate-400 hover:text-rose-600"><Trash2 size={16} /></button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );

      if (loading) {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center text-blue-600">
            <Loader2 className="animate-spin mb-4" size={48} />
            <p className="text-lg font-bold text-gray-700">系統載入中，正在連接您的專屬資料庫...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans relative">
          <header className="bg-slate-800 text-white shadow-md sticky top-0 z-20">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="bg-blue-500 p-2 rounded-lg"><LayoutDashboard size={24} className="text-white" /></div>
                <div>
                  <h1 className="text-xl font-bold tracking-wide">國小事務組長</h1>
                  <p className="text-xs text-slate-300">業務檢索與提醒系統 (公開發布版)</p>
                </div>
              </div>
              <button onClick={() => downloadBackup(activeItems, tips, trashedItems)} className="hidden sm:flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-600 shadow-sm" title="將目前所有資料匯出成 .txt 文字檔備份">
                <Download size={16} /><span>匯出備份 (.txt)</span>
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">
            <aside className="md:w-64 flex-shrink-0">
              <nav className="flex flex-col gap-2 bg-white p-4 rounded-xl shadow-sm border border-slate-100 sticky top-24">
                <button onClick={() => { setActiveTab('dashboard'); setEditingItem(null); }} className={`flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}><LayoutDashboard size={20} />主控台 (期限提醒)</button>
                <button onClick={() => { setActiveTab('list'); setEditingItem(null); }} className={`flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition-colors ${activeTab === 'list' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}><ListTodo size={20} />所有業務庫 (檢索)</button>
                <button onClick={handleAddNew} className={`flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition-colors ${activeTab === 'form' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}><Plus size={20} />新增學到的知識</button>
                
                <div className="h-px bg-slate-100 my-2"></div>
                
                <button onClick={() => { setActiveTab('trash'); setEditingItem(null); }} className={`flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition-colors ${activeTab === 'trash' ? 'bg-rose-50 text-rose-700' : 'text-slate-600 hover:bg-rose-50 hover:text-rose-700'}`}>
                  <Trash size={20} />
                  垃圾桶
                  {trashedItems.length > 0 && (
                    <span className="ml-auto bg-rose-200 text-rose-800 text-xs py-0.5 px-2 rounded-full font-bold">{trashedItems.length}</span>
                  )}
                </button>
                <button onClick={() => { setActiveTab('categories'); setEditingItem(null); }} className={`flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition-colors ${activeTab === 'categories' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}><Settings size={20} />系統與分類設定</button>
              </nav>
            </aside>

            <div className="flex-1 min-w-0">
              {activeTab === 'dashboard' && renderDashboard()}
              {activeTab === 'list' && renderItemList()}
              {activeTab === 'form' && renderItemForm()}
              {activeTab === 'trash' && renderTrashBin()}
              {activeTab === 'categories' && renderCategoryManager()}
            </div>
          </main>
          
          {toastMsg && (
            <div className="fixed bottom-6 right-6 bg-slate-800 text-white px-5 py-3 rounded-lg shadow-xl flex items-center z-50 transition-all duration-300 border border-slate-700">
              <CheckCircle2 size={18} className="mr-3 text-emerald-400" /><span className="font-medium text-sm">{toastMsg}</span>
            </div>
          )}

          {/* AI 功能的彈出視窗 */}
          {draftModal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-indigo-50/80">
                  <h3 className="font-bold text-indigo-900 text-lg flex items-center gap-2">
                    <Sparkles className="text-indigo-500" size={20} />
                    {draftModal.title}
                  </h3>
                  <button onClick={() => setDraftModal({ isOpen: false, title: '', content: '', loading: false })} className="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-indigo-100 transition-colors">
                    <X size={20} />
                  </button>
                </div>
                <div className="p-6 overflow-y-auto flex-1 custom-scrollbar">
                  {draftModal.loading ? (
                    <div className="flex flex-col items-center justify-center py-16 text-slate-500">
                      <Loader2 className="animate-spin w-10 h-10 text-indigo-500 mb-4" />
                      <p className="font-bold text-indigo-600 animate-pulse">AI 正在為您撰寫內容中，請稍候...</p>
                    </div>
                  ) : (
                    <div className="whitespace-pre-wrap font-sans text-sm leading-relaxed text-slate-700 bg-slate-50 p-6 rounded-xl border border-slate-200">
                      {draftModal.content}
                    </div>
                  )}
                </div>
                {!draftModal.loading && draftModal.content && !draftModal.content.startsWith('❌') && (
                  <div className="px-6 py-4 border-t border-slate-100 bg-white flex justify-end">
                    <button 
                      onClick={() => handleCopy(draftModal.content)}
                      className="flex items-center gap-2 bg-indigo-600 text-white px-6 py-2.5 rounded-lg hover:bg-indigo-700 transition-colors font-bold shadow-md"
                    >
                      <Copy size={18} /> 複製文字
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
